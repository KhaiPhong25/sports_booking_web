services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_booking}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_local_password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["npm", "run", "db:migrate", "-w", "@sports-booking/api"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports_local_password}@postgres:5432/${POSTGRES_DB:-sports_booking}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sports-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace-local-minio-secret-long}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports_local_password}@postgres:5432/${POSTGRES_DB:-sports_booking}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret-change-before-production}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sports-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-local-minio-secret-long}
      MINIO_BUCKET: ${MINIO_BUCKET:-venue-images}
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports_local_password}@postgres:5432/${POSTGRES_DB:-sports_booking}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: Đặt Sân <no-reply@sports.local>
      OUTBOX_POLL_INTERVAL_MS: 500
      OUTBOX_REPLAY_AFTER_SECONDS: 60
      WORKER_HEALTH_PORT: 3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
  redis-data:
  minio-data:
